name: TripAtlas
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM и BUNDLE_ID_PREFIX задаются в Config/Local.xcconfig

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  TripAtlas:
    type: application
    platform: iOS
    sources:
      - path: TripAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tripatlas
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Путешествия"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Приложение анализирует даты и геолокацию ваших фото, чтобы автоматически находить поездки. Фото не покидают устройство."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TripAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripAtlasTests
    dependencies:
      - target: TripAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tripatlas.tests

schemes:
  TripAtlas:
    build:
      targets:
        TripAtlas: all
        TripAtlasTests: [test]
    test:
      targets:
        - TripAtlasTests
