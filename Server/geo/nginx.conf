# Public front for the TripAtlas borders server. Cloudflare Tunnel -> 127.0.0.1:8088 -> Nominatim on 127.0.0.1:8080.
# Only the app's exact request and /status are served (other paths 404, other queries 400,
# other methods 403); coordinates are never logged.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    # Real client address from Cloudflare (the tunnel itself connects from localhost).
    map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
    # The app sends up to 12 requests a second (3 at a time), so 30 leaves room for two phones
    # behind one address (home Wi-Fi, carrier NAT).
    limit_req_zone $client_ip zone=perip:20m rate=30r/s;
    limit_req_status 429;

    # Path only: no query string, so no photo coordinates in the logs. The error log would repeat
    # the full request line (with lat/lon) on every 429/502/504, so it only gets critical errors;
    # rejected and failed requests stay visible through $status in the access log.
    log_format noquery '$client_ip [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout noquery;
    error_log /dev/stderr crit;
    limit_req_log_level info;
    proxy_max_temp_file_size 0;

    server {
        listen 127.0.0.1:8088;

        location = /reverse {
            limit_except GET { deny all; }
            # Exactly the app's query, in its order (CityBoundaryService.requestURL; tests pin it).
            # Whole-string match, so duplicated or extra parameters cannot slip through.
            if ($args !~ "^format=jsonv2&lat=-?[0-9]{1,2}\.[0-9]{5}&lon=-?[0-9]{1,3}\.[0-9]{5}&zoom=10&polygon_geojson=1&polygon_threshold=0\.0005$") {
                return 400;
            }
            limit_req zone=perip burst=30 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_hide_header X-Powered-By;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /status {
            limit_except GET { deny all; }
            limit_req zone=perip burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080/status;
        }

        location / { return 404; }
    }
}
